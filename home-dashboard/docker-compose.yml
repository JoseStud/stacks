services:
  tunet:
    # Upstream ghcr.io/oyvhov/tunet is amd64-only (its docker-publish.yml has
    # no multi-arch/buildx setup); our workers are arm64, so this stack was
    # permanently unschedulable. Rebuilt from the same source revision
    # (c8d07a028a8c6510463e468b5c1a1406a23246cc) natively for arm64.
    image: ghcr.io/josestud/tunet:1.21.1-arm64
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATA_DIR=/app/data
      - TUNET_INTERNAL_HA_URL=${HOME_ASSISTANT_URL}
      - TUNET_INTERNAL_HA_FALLBACK_URL=${HOME_ASSISTANT_URL}
      - TUNET_ENCRYPTION_MODE=off
      - TUNET_DATA_KEY=
      - TUNET_DATA_KEY_SALT=
    volumes:
      - tunet_data:/app/data
    networks:
      - traefik_proxy
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      placement:
        constraints:
          - node.labels.location == cloud
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tunet.rule=Host(`tunet.${BASE_DOMAIN}`)"
        - "traefik.http.routers.tunet.entrypoints=websecure"
        - "traefik.http.routers.tunet.tls.certresolver=letsencrypt"
        - "traefik.http.routers.tunet.middlewares=authelia@swarm"
        - "traefik.http.services.tunet.loadbalancer.server.port=3002"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/api/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  traefik_proxy:
    external: true

volumes:
  tunet_data:
